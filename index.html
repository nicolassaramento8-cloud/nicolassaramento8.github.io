<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Projetos</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #busca { padding: 8px; width: 100%; max-width: 400px; margin-bottom: 15px; font-size: 16px; }
    .app { margin: 10px 0; }
    .app a { font-size: 18px; }
  </style>
</head>
<body>
  <h1>Bem-vindo ao meu site!</h1>

  <div id="login">
    <p>Digite a senha para ver o conteúdo:</p>
    <input type="password" id="senha">
    <button onclick="verificar()">Entrar</button>
  </div>

  <div id="conteudo" style="display:none;">
    <input type="text" id="busca" placeholder="Pesquisar app..." oninput="pesquisar()">

    <div id="lista">
      <div class="app">
        <a href="app-debug.zip" download>Baixar Velocimetro Para Bike</a>
      </div>
      <div class="app">
        <a href="app-debug2.zip" download>Baixar Astro</a>
      </div>
      <div class="app">
        <a href="app-debug3.zip" download>Baixar Nome do App 3</a>
      </div>
    </div>

    <p id="nada" style="display:none;">Nenhum app encontrado.</p>
  </div>

  <script>
    function verificar() {
      var senha = document.getElementById("senha").value;
      if (senha === "20153698") {
        document.getElementById("login").style.display = "none";
        document.getElementById("conteudo").style.display = "block";
      } else {
        alert("Senha incorreta!");
      }
    }

    function pesquisar() {
      var texto = document.getElementById("busca").value.toLowerCase();
      var apps = document.querySelectorAll(".app");
      var achou = false;
      apps.forEach(function (app) {
        if (app.innerText.toLowerCase().includes(texto)) {
          app.style.display = "block";
          achou = true;
        } else {
          app.style.display = "none";
        }
      });
      document.getElementById("nada").style.display = achou ? "none" : "block";
    }
  </script>
</body>
</html>
